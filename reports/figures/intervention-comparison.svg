<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="640" viewBox="0 0 1120 640" role="img" aria-labelledby="title desc">
  <title id="title">Stage-5 intervention comparison</title>
  <desc id="desc">Stylised reactive-support and thermal-reinforcement sensitivity. Reported Stage-5 pass labels are quarantined pending clarification of the virtual-bus voltage metric and screening treatment.</desc>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <style>
    text { font-family: Arial, Helvetica, sans-serif; fill: #17212b; }
    .title { font-size: 25px; font-weight: 700; }
    .subtitle { font-size: 13px; fill: #556372; }
    .head { font-size: 13px; font-weight: 700; }
    .cell { font-size: 13px; }
    .small { font-size: 11px; fill: #556372; }
    .warn { font-size: 12px; fill: #9a3412; }
  </style>
  <text x="70" y="46" class="title">Stage-5 intervention comparison</text>
  <text x="70" y="70" class="subtitle">Stylised sensitivity results; reported Stage-5 pass labels are not final security conclusions.</text>
  <rect x="70" y="100" width="980" height="370" fill="#f8fafc" stroke="#cbd5df"/>
  <g class="head">
    <text x="90" y="135">Stage</text>
    <text x="290" y="135">Minimum voltage</text>
    <text x="490" y="135">Maximum line loading</text>
    <text x="720" y="135">Recorded status</text>
    <text x="900" y="135">Interpretation</text>
  </g>
  <g stroke="#cbd5df">
    <line x1="70" y1="155" x2="1050" y2="155"/>
    <line x1="70" y1="225" x2="1050" y2="225"/>
    <line x1="70" y1="295" x2="1050" y2="295"/>
    <line x1="70" y1="365" x2="1050" y2="365"/>
    <line x1="70" y1="435" x2="1050" y2="435"/>
    <line x1="260" y1="100" x2="260" y2="470"/>
    <line x1="460" y1="100" x2="460" y2="470"/>
    <line x1="690" y1="100" x2="690" y2="470"/>
    <line x1="870" y1="100" x2="870" y2="470"/>
  </g>
  <g class="cell">
    <text x="90" y="195">S5.1 baseline</text>
    <text x="290" y="195">0.739 pu</text>
    <text x="490" y="195">174.42%</text>
    <text x="720" y="195">not secure</text>
    <text x="900" y="195">fails both screens</text>

    <text x="90" y="265">S5.2 voltage support</text>
    <text x="290" y="265">0.917 pu</text>
    <text x="490" y="265">166.23%</text>
    <text x="720" y="265">not secure</text>
    <text x="900" y="265">thermal overload remains</text>

    <text x="90" y="335">S5.3 thermal reinforcement</text>
    <text x="290" y="335">not reported</text>
    <text x="490" y="335">94.99%</text>
    <text x="720" y="335">reported pass*</text>
    <text x="900" y="335">not a final conclusion</text>

    <text x="90" y="405">S5.4 joint sensitivity</text>
    <text x="290" y="405">0.917 pu</text>
    <text x="490" y="405">94.99%</text>
    <text x="720" y="405">reported pass*</text>
    <text x="900" y="405">not a final conclusion</text>
  </g>
  <rect x="70" y="500" width="980" height="72" fill="#fff7ed" stroke="#fdba74"/>
  <text x="90" y="530" class="warn">* The consolidated Stage-5 data label is quarantined pending clarification of the virtual-bus voltage metric and screening treatment.</text>
  <text x="90" y="552" class="small">This sensitivity is not an installation recommendation and does not establish a globally secure intervention.</text>
</svg>
