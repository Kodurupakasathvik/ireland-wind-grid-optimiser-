<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="640" viewBox="0 0 1120 640" role="img" aria-labelledby="title desc">
  <title id="title">Forecast validation error by horizon</title>
  <desc id="desc">Mean normalised mean absolute error from five expanding chronological validation windows. Lower bars are better.</desc>
  <rect width="1120" height="640" fill="white"/>
  <style>text{font-family:Arial,Helvetica,sans-serif;fill:#17212b}.title{font-size:25px;font-weight:700}.sub{font-size:13px;fill:#556372}.axis{font-size:12px;fill:#556372}.value{font-size:13px;font-weight:700}.model{font-size:11px;fill:#556372}</style>
  <text x="105" y="36" class="title">Forecast validation error by horizon</text>
  <text x="105" y="58" class="sub">Mean NMAE from five expanding chronological validation windows; lower is better.</text>
  <line x1="105" y1="500" x2="1080" y2="500" stroke="#17212b"/>
  <line x1="105" y1="100" x2="105" y2="500" stroke="#17212b"/>
  <g stroke="#cbd5df"><line x1="105" y1="500" x2="1080" y2="500"/><line x1="105" y1="367" x2="1080" y2="367"/><line x1="105" y1="233" x2="1080" y2="233"/><line x1="105" y1="100" x2="1080" y2="100"/></g>
  <g class="axis" text-anchor="end"><text x="95" y="504">0</text><text x="95" y="371">5</text><text x="95" y="237">10</text><text x="95" y="104">15</text></g>
  <text x="25" y="320" class="axis" transform="rotate(-90 25 320)">Mean NMAE (%)</text>
  <g fill="#2c6eaf"><rect x="180" y="435" width="100" height="65"/><rect x="365" y="402" width="100" height="98"/><rect x="550" y="357" width="100" height="143"/><rect x="735" y="274" width="100" height="226"/><rect x="920" y="129" width="100" height="371"/></g>
  <g class="value" text-anchor="middle"><text x="230" y="425">2.44%</text><text x="415" y="392">3.66%</text><text x="600" y="347">5.37%</text><text x="785" y="264">8.47%</text><text x="970" y="119">13.90%</text></g>
  <g text-anchor="middle"><text x="230" y="525">15 min</text><text x="415" y="525">30 min</text><text x="600" y="525">1 hour</text><text x="785" y="525">2 hours</text><text x="970" y="525">4 hours</text><text x="230" y="547" class="model">Direct multi-horizon LR</text><text x="415" y="547" class="model">Linear regression</text><text x="600" y="547" class="model">Linear regression</text><text x="785" y="547" class="model">Linear regression</text><text x="970" y="547" class="model">Linear regression</text></g>
</svg>
