<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="640" viewBox="0 0 1120 640" role="img" aria-labelledby="title desc">
  <title id="title">Production forecast AC security screen</title>
  <desc id="desc">All five saved production forecast horizons have minimum voltage below 0.95 per unit and maximum line loading above 100 percent.</desc>
  <rect width="1120" height="640" fill="white"/>
  <style>text{font-family:Arial,Helvetica,sans-serif;fill:#17212b}.title{font-size:25px;font-weight:700}.sub{font-size:13px;fill:#556372}.axis{font-size:12px;fill:#556372}.label{font-size:12px}.value{font-size:11px;font-weight:700}.small{font-size:11px;fill:#556372}</style>
  <text x="105" y="36" class="title">Production forecast AC security screen</text><text x="105" y="58" class="sub">Every saved forecast horizon fails at least one configured AC criterion.</text>
  <g><rect x="105" y="95" width="975" height="190" fill="none" stroke="#cbd5df"/><text x="105" y="86" class="label">Minimum voltage (pu)</text><line x1="105" y1="142" x2="1080" y2="142" stroke="#d97706" stroke-width="2" stroke-dasharray="6 4"/><text x="1080" y="135" text-anchor="end" class="small">limit 0.95</text><g stroke="#cbd5df"><line x1="105" y1="285" x2="1080" y2="285"/><line x1="105" y1="238" x2="1080" y2="238"/><line x1="105" y1="190" x2="1080" y2="190"/><line x1="105" y1="142" x2="1080" y2="142"/><line x1="105" y1="95" x2="1080" y2="95"/></g><g class="axis" text-anchor="end"><text x="95" y="289">0.85</text><text x="95" y="242">0.89</text><text x="95" y="194">0.92</text><text x="95" y="146">0.95</text><text x="95" y="99">1.00</text></g><polyline points="105,232 349,229 593,226 836,217 1080,207" fill="none" stroke="#2c6eaf" stroke-width="3"/><g fill="#2c6eaf"><circle cx="105" cy="232" r="5"/><circle cx="349" cy="229" r="5"/><circle cx="593" cy="226" r="5"/><circle cx="836" cy="217" r="5"/><circle cx="1080" cy="207" r="5"/></g><g text-anchor="middle" class="value"><text x="105" y="223">0.907</text><text x="349" y="220">0.907</text><text x="593" y="217">0.908</text><text x="836" y="208">0.910</text><text x="1080" y="198">0.914</text></g></g>
  <g><rect x="105" y="355" width="975" height="190" fill="none" stroke="#cbd5df"/><text x="105" y="346" class="label">Maximum line loading (%)</text><line x1="105" y1="472" x2="1080" y2="472" stroke="#d97706" stroke-width="2" stroke-dasharray="6 4"/><text x="1080" y="465" text-anchor="end" class="small">limit 100</text><g stroke="#cbd5df"><line x1="105" y1="545" x2="1080" y2="545"/><line x1="105" y1="472" x2="1080" y2="472"/><line x1="105" y1="399" x2="1080" y2="399"/><line x1="105" y1="355" x2="1080" y2="355"/></g><g class="axis" text-anchor="end"><text x="95" y="549">0</text><text x="95" y="476">100</text><text x="95" y="403">200</text><text x="95" y="359">260</text></g><polyline points="105,372 349,373 593,373 836,374 1080,376" fill="none" stroke="#c43d4f" stroke-width="3"/><g fill="#c43d4f"><circle cx="105" cy="372" r="5"/><circle cx="349" cy="373" r="5"/><circle cx="593" cy="373" r="5"/><circle cx="836" cy="374" r="5"/><circle cx="1080" cy="376" r="5"/></g><g text-anchor="middle" class="value"><text x="105" y="364">237.4</text><text x="349" y="365">237.0</text><text x="593" y="365">236.6</text><text x="836" y="366">235.4</text><text x="1080" y="368">232.5</text></g><g text-anchor="middle" class="label"><text x="105" y="571">15 min</text><text x="349" y="571">30 min</text><text x="593" y="571">1 hour</text><text x="836" y="571">2 hours</text><text x="1080" y="571">4 hours</text></g></g>
</svg>
