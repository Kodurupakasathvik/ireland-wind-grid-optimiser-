<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="640" viewBox="0 0 1120 640" role="img" aria-labelledby="title desc">
  <title id="title">S2 controlled reactive-load continuation</title>
  <desc id="desc">Conditional AC solutions up to 7.1 percent of the assumed reactive load are severely undervoltage and thermally overloaded.</desc>
  <rect width="1120" height="640" fill="white"/>
  <style>text{font-family:Arial,Helvetica,sans-serif;fill:#17212b}.title{font-size:25px;font-weight:700}.sub{font-size:13px;fill:#556372}.axis{font-size:12px;fill:#556372}.label{font-size:12px}.small{font-size:11px;fill:#556372}</style>
  <text x="105" y="36" class="title">S2 controlled reactive-load continuation</text><text x="105" y="58" class="sub">Conditional converged variants only; all remain outside configured security limits.</text>
  <g><rect x="105" y="95" width="975" height="190" fill="none" stroke="#cbd5df"/><text x="105" y="86" class="label">Minimum voltage (pu)</text><line x1="105" y1="122" x2="1080" y2="122" stroke="#d97706" stroke-width="2" stroke-dasharray="6 4"/><text x="1080" y="115" text-anchor="end" class="small">limit 0.95</text><g stroke="#cbd5df"><line x1="105" y1="285" x2="1080" y2="285"/><line x1="105" y1="231" x2="1080" y2="231"/><line x1="105" y1="176" x2="1080" y2="176"/><line x1="105" y1="122" x2="1080" y2="122"/><line x1="105" y1="95" x2="1080" y2="95"/></g><g class="axis" text-anchor="end"><text x="95" y="289">0.60</text><text x="95" y="235">0.70</text><text x="95" y="180">0.80</text><text x="95" y="126">0.95</text><text x="95" y="99">1.00</text></g><polyline points="105,242 242,247 379,252 516,258 653,264 790,270 927,279 1080,284" fill="none" stroke="#7057a8" stroke-width="3"/><g fill="#7057a8"><circle cx="105" cy="242" r="4"/><circle cx="242" cy="247" r="4"/><circle cx="379" cy="252" r="4"/><circle cx="516" cy="258" r="4"/><circle cx="653" cy="264" r="4"/><circle cx="790" cy="270" r="4"/><circle cx="927" cy="279" r="4"/><circle cx="1080" cy="284" r="4"/></g></g>
  <g><rect x="105" y="355" width="975" height="190" fill="none" stroke="#cbd5df"/><text x="105" y="346" class="label">Maximum line loading (%)</text><line x1="105" y1="450" x2="1080" y2="450" stroke="#d97706" stroke-width="2" stroke-dasharray="6 4"/><text x="1080" y="443" text-anchor="end" class="small">limit 100</text><g stroke="#cbd5df"><line x1="105" y1="545" x2="1080" y2="545"/><line x1="105" y1="450" x2="1080" y2="450"/><line x1="105" y1="355" x2="1080" y2="355"/></g><g class="axis" text-anchor="end"><text x="95" y="549">0</text><text x="95" y="454">100</text><text x="95" y="359">200</text></g><polyline points="105,379 242,378 379,377 516,376 653,376 790,373 927,370 1080,369" fill="none" stroke="#c43d4f" stroke-width="3"/><g fill="#c43d4f"><circle cx="105" cy="379" r="4"/><circle cx="242" cy="378" r="4"/><circle cx="379" cy="377" r="4"/><circle cx="516" cy="376" r="4"/><circle cx="653" cy="376" r="4"/><circle cx="790" cy="373" r="4"/><circle cx="927" cy="370" r="4"/><circle cx="1080" cy="369" r="4"/></g><g text-anchor="middle" class="axis"><text x="105" y="571">0%</text><text x="242" y="571">1%</text><text x="379" y="571">2%</text><text x="516" y="571">3%</text><text x="653" y="571">4%</text><text x="790" y="571">5%</text><text x="927" y="571">6%</text><text x="1080" y="571">7.1%</text></g><text x="592" y="604" text-anchor="middle" class="axis">Assumed reactive load as % of full reference value</text></g>
</svg>
